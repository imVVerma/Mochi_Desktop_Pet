name: Build and Release Mochi Desktop Pet

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Executable
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Build Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pillow pystray pyinstaller pytest

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Run Test Suite
        run: |
          python -m pytest

      - name: Generate Application Icon
        run: |
          python build/generate_icon.py

      - name: Compile Standalone Executable with PyInstaller
        run: |
          pyinstaller --noconsole --onefile `
            --name "DesktopPet" `
            --icon "build/icon.ico" `
            --add-data "config.json;." `
            --hidden-import "PIL" `
            --hidden-import "pystray" `
            --hidden-import "pystray._win32" `
            --clean `
            main.py

      - name: Build Android APK
        working-directory: mobile/flutter_companion
        run: |
          flutter pub get
          flutter build apk --release

      - name: Stage Android Release Asset
        run: |
          New-Item -ItemType Directory -Force -Path dist/mobile | Out-Null
          Copy-Item mobile/flutter_companion/build/app/outputs/flutter-apk/app-release.apk dist/mobile/MochiCompanion.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/DesktopPet.exe
            dist/mobile/MochiCompanion.apk
            config.json
          draft: false
          prerelease: false
          generate_release_notes: true
